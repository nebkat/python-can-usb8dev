name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[test]
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - name: Verify the interface registered
        run: |
          python - <<'PY'
          from can.interfaces import VALID_INTERFACES
          assert "usb8dev" in VALID_INTERFACES, "usb8dev entry point not registered"
          from can.interface import _get_class_for_interface
          cls = _get_class_for_interface("usb8dev")
          assert cls.__name__ == "Usb8DevBus"
          print("usb8dev interface OK:", cls)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
